name: 'NormaHub AI Code Review'
description: 'Production-grade GitHub Action for automated Pull Request code reviews powered by NormaHub AI models (DeepSeek, Claude).'
author: 'NormaHub Team'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  normahub_api_key:
    description: 'NormaHub API Key (get from https://normahub.cc)'
    required: true
  github_token:
    description: 'GitHub Token for posting and updating review comments'
    required: true
    default: ${{ github.token }}
  model:
    description: 'Model ID to use for code review (e.g. deepseek-v4.1-flash, claude-sonnet-5-5)'
    required: false
    default: 'deepseek-v4.1-flash'
  max_diff_length:
    description: 'Maximum characters of diff to review before truncating'
    required: false
    default: '50000'
  ignore_patterns:
    description: 'Custom comma- or newline-separated regex patterns to exclude files'
    required: false
    default: ''
  fail_on_critical:
    description: 'Fail the GitHub Action step if any CRITICAL security/logic vulnerabilities are found'
    required: false
    default: 'false'
  inline_comments:
    description: 'Post native in-line review suggestions directly to PR code lines (GitHub Reviews API)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run NormaHub Code Review
      shell: bash
      env:
        NORMAHUB_API_KEY: ${{ inputs.normahub_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_DIFF_LENGTH: ${{ inputs.max_diff_length }}
        INPUT_IGNORE_PATTERNS: ${{ inputs.ignore_patterns }}
        INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
        INPUT_INLINE_COMMENTS: ${{ inputs.inline_comments }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        INPUT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        node "${{ github.action_path }}/src/index.js"

